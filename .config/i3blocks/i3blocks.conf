# Global
markup=pango
separator=false
separator_block_width=0

# Memory
[memory]
command=~/.config/scripts/memory.sh
interval=1

# CPU usage
[cpu_usage]
command=~/.config/scripts/cpu_usage.sh
interval=1

[wifi]
command=~/.config/scripts/wifi.sh
interval=1

# Volume
[volume]
command=~/.config/scripts/volume.sh
signal=12
interval=once

# Brightness
[brightness]
command=~/.config/scripts/brightness.sh
signal=11
interval=once

# Battery
[battery]
command=~/.config/scripts/battery.sh
interval=1

# Time
[time]
command=~/.config/scripts/time.sh
interval=1
