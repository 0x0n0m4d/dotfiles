# ── Font ─────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
font_size        7.0

# ── Cursor ───────────────────────────────────────────────────────────────────
cursor_shape           block
cursor_blink_interval  0.5

# ── Window ───────────────────────────────────────────────────────────────────
background_opacity     1.0
hide_window_decorations yes

# ── Scrollback ────────────────────────────────────────────────────────────────
scrollback_lines       10000
scrollback_pager nvim -c "silent write! /tmp/kitty_scrollback_buffer | te cat /tmp/kitty_scrollback_buffer - " +$

# ── Clipboard ────────────────────────────────────────────────────────────────
copy_on_select         yes
strip_trailing_spaces  always

# ── Tabs & Splits ────────────────────────────────────────────────────────────
tab_bar_style hidden

enabled_layouts splits,stack

map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+minus  launch --cwd=current --location=vsplit
map ctrl+shift+s      launch --cwd=current --location=hsplit
map ctrl+shift+f      toggle_layout stack
map ctrl+shift+h      neighboring_window left
map ctrl+shift+l      neighboring_window right
map ctrl+shift+k      neighboring_window up
map ctrl+shift+j      neighboring_window down
map ctrl+shift+r      start_resizing_window
map ctrl+shift+w      close_window
map ctrl+shift+'      show_scrollback
map ctrl+t            no_op

# ── Shell integration ────────────────────────────────────────────────────────
shell_integration      enabled

# ── Close confirmation ───────────────────────────────────────────────────────
confirm_os_window_close 0

# BEGIN_KITTY_THEME
# Gruvbox Material Dark Medium
include solar.conf

allow_remote_control yes
graphics_protocol kitty
