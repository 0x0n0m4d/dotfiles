[buffer]
scripting = true
images = true
user-style = '''
  :root {
    color: #ebdbb2 !important;
    background-color: #282828 !important;
  }
  a { color: #83a598 !important; }
  a:visited { color: #d3869b !important; }
  h1, h2, h3 { color: #fabd2f !important; }
  code, pre { color: #b8bb26 !important; }
'''

[display]
image-mode = "kitty"
default-background-color = "#282828"
default-foreground-color = "#ebdbb2"

[network]
default-headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64; rv:124.0) Gecko/20100101 Firefox/124.0" }
