font pango: BigBlueTerm437 Nerd Font Regular 10
workspace_layout default

for_window [class="^.*"] border pixel 2
default_border pixel 2

gaps inner 1
gaps outer 1

hide_edge_borders both

# color settings fo windows
set $color1     #282828
set $color2     #3c3836
set $color3     #b16286
set $color4     #cc241d
#app_id                          border          bground         text            indicator       child_border
client.focused               $color3           $color3         $color1           $color3         $color3
client.unfocused             $color3           $color1         $color3           $color1         $color2
client.focused_inactive      $color1           $color3         $color1           $color3         $color2
client.urgent                $color4           $color4         $color1           $color4         $color4
